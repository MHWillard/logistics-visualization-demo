# Docker Compose Orchestration for Logistics Visualization Demo
# Three containers: backend (ASP.NET), frontend (Next.js), database (SQL Server)
# See Agents/docker-agent.md for comprehensive guidance

version: '3.9'

services:
  # SQL Server 2022 Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: logistics-sqlserver
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourUpdatedPassword123!"  # Ensure strong password
    ports:
      - "1433:1433"  # SQL Server port (expose for local dev/testing)
    volumes:
      - data-volume:/var/opt/mssql  # Persist database across restarts
    networks:
      - app-network
    restart: no

  # .NET 8 Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5088:5088"  # Backend API
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - app-network
    restart: on-failure

  # Next.js Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: logistics-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:5088  # Internal: use container hostname
    ports:
      - "3000:3000"  # Frontend
    #depends_on:
      #backend:
        #condition: service_started
    networks:
      - app-network
    restart: on-failure

volumes:
  data-volume:
    driver: local

networks:
  app-network:
    driver: bridge
